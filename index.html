<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(214, 51, 132, 0.15);
      max-width: 480px;
      text-align: center;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    h1 {
      color: #d63384;
      font-size: 2rem;
      margin-bottom: 1.2rem;
    }
    p {
      color: #444;
      font-size: 1.2rem;
      line-height: 1.8;
      font-weight: 500;
    }
    .petal {
      position: absolute;
      top: -50px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0.9;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(60px);
        opacity: 0.2;
      }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌸 Thinking of You 🌸</h1>
    <p>
      I miss you 🥺❤️ I miss you so much 😭✨ I miss your smile, I miss your hugs, and I miss everything about you 😩💖 Seriously, I just really, really miss you right now!! 🥺🥰💫
    </p>
  </div>

  <script>
    const symbols = ['🌸', '🌺', '🌹', '✨', '💖', '🌷', '💕'];
    
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 3 + 4 + 's'; // 4s to 7s duration
      petal.style.fontSize = Math.random() * 12 + 18 + 'px'; // Varied sizes
      document.body.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 7000);
    }

    // Generate floating petals continuously
    setInterval(createPetal, 250);
  </script>
</body>
</html>
