<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Princess ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
height:100vh;
background:linear-gradient(135deg,#ffd6ea,#ffc2e2,#ffe6f2,#ffb6d9);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%,rgba(255,255,255,.25),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(255,255,255,.2),transparent 40%);
pointer-events:none;
}

.card{
width:90%;
max-width:850px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(10px);
padding:35px;
border-radius:30px;
border:3px solid rgba(255,255,255,.4);
box-shadow:0 0 35px rgba(255,105,180,.5);
z-index:2;
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 20px hotpink;}
to{box-shadow:0 0 50px deeppink;}
}

h1{
font-size:3em;
margin-bottom:15px;
text-shadow:0 0 12px hotpink;
}

h2{
margin-bottom:20px;
}

p{
font-size:1.2em;
line-height:1.8;
margin-bottom:10px;
}

.love{
font-size:1.3em;
color:#fff5fb;
font-weight:bold;
}

footer{
margin-top:25px;
font-size:1.4em;
font-weight:bold;
}

.flower{
position:fixed;
top:-10%;
font-size:35px;
pointer-events:none;
animation:fall linear infinite;
opacity:.95;
}

@keyframes fall{
0%{
transform:translateY(-10vh) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate
